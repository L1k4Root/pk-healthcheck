name: ci

on:
  push:
    branches: [main]
    # Full versions only: the floating major tag (v1) must not trigger a release.
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Unit + integration tests, with and without ASan/UBSan (glibc, gcc).
  c:
    uses: L1k4Root/pk-ci-workflows/.github/workflows/c-ci.yml@v1

  # The real use case: a distroless image (the OTel Collector) becomes
  # healthy thanks to the probe.
  collector-example:
    needs: c
    uses: L1k4Root/pk-ci-workflows/.github/workflows/docker-ci.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      image-name: pk-healthcheck-collector-example
      dockerfile: examples/collector/Dockerfile

  # On version tags: publish the multi-arch image to ghcr.io and attach static
  # binaries to the GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [c, collector-example]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pk-healthcheck
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract static binaries
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          outputs: type=local,dest=out

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/linux_amd64/healthcheck healthcheck-linux-amd64
          cp out/linux_arm64/healthcheck healthcheck-linux-arm64
          sha256sum healthcheck-linux-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" healthcheck-linux-* SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes
